<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12px;
      color: #bbb;
      line-height: 1.5;
      margin: 6px 0;
    }
    .stats {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }
    .stat {
      flex: 1;
      background: #232323;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat .n {
      font-size: 16px;
      font-weight: 700;
      color: #3fb950;
    }
    .stat .l {
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>NeetCode Company Tags</h1>
  <p>Open any problem on <a href="https://neetcode.io/practice" target="_blank">neetcode.io</a> and a panel will appear in the bottom-right showing which companies have asked it.</p>
  <div class="stats">
    <div class="stat"><div class="n" id="pcount">–</div><div class="l">problems</div></div>
    <div class="stat"><div class="n" id="ccount">–</div><div class="l">companies</div></div>
  </div>
  <p id="updated"></p>
  <p><a href="https://github.com/ZOXT/-NeetCode-Company-Tags" target="_blank" rel="noreferrer">View on GitHub</a></p>
  <script src="popup.js"></script>
</body>
</html>
